
name: Build Memo Tugas 3.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ditemukan file ZIP di halaman utama repository."
            exit 1
          fi
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "${{ steps.zip.outputs.file }}" -d project

      - name: Locate Gradle project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "File settings.gradle(.kts) tidak ditemukan."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Tugas-3.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
